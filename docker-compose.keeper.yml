services:
  frontier-keeper:
    build:
      context: .
      dockerfile: program/Dockerfile.keeper
    restart: unless-stopped
    environment:
      BASE_RPC: ${BASE_RPC:-https://api.devnet.solana.com}
      ER_RPC: ${ER_RPC:-https://devnet-as.magicblock.app}
      MODES: ${MODES:-1}
      CASUAL_DAY: ${CASUAL_DAY:-20713}
      KEEPER_SECRET_JSON: ${KEEPER_SECRET_JSON:?set KEEPER_SECRET_JSON to the keeper keypair byte array}
      VALIDATOR: ${VALIDATOR:-}
      VRF_BASE_QUEUE: ${VRF_BASE_QUEUE:-Cuj97ggrhhidhbu39TijNVqE74xvKJ69gDervRUXAxGh}
      KEEPER_HEALTH_PORT: 8787
    ports:
      - "127.0.0.1:8787:8787"
